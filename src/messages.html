	<!-- modal message window / alert like -->
	<div id="customModalOverlay" class='customModalOverlay'>
  	<div id="customModal" class='customModal'>
    	<h2 id="modalTitle">Title</h2>
    	<p id="modalMessage">Message</p><br>
    	<div style="text-align: center;">
			<button id='close-message' class='basic-button'> Ok </button>
		</div>
  	</div>
	</div>

	<!-- modal message window / confirm like -->
	<div id="customModalOverlayConfirm" class='customModalOverlay'>
  	<div id="customModalConfirm" class='customModal'>
    	<h2 id="modalTitleConfirm">Title</h2>
    	<p id="modalMessageConfirm">Message</p><br>
    	<div style="text-align: center;">
			<button id='close-confirm-true' class='basic-button'> Yes </button>&nbsp;
			<button id='close-confirm-false' class='basic-button'> Cancel </button>
		</div>
  	</div>
	</div>
